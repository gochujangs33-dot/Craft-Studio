[package]
name = "artcraft-studio"
version = "1.0.0"
edition = "2021"
description = "ArtCraft Studio - one launcher for all 13 open-source Craft apps"
license = "Apache-2.0"

[[bin]]
name = "ArtCraftStudio"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
