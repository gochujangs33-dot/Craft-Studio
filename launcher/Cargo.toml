[package]
name = "artcraft-studio"
version = "1.0.4"
edition = "2021"
description = "ArtCraft Studio - one launcher for all 13 open-source Craft apps"
license = "Apache-2.0"

[[bin]]
name = "ArtCraftStudio"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.4"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_Storage_Xps",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
