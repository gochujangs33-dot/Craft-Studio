name: Build and Release Multiplatform

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows release bundle
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-all.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraftStudio-Windows-x64
          path: |
            dist/ArtCraftStudio.exe
            release/ArtCraftStudio-portable-x64.zip

  build-macos:
    name: Build macOS Universal (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Universal macOS Binary
        run: |
          cd launcher
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/ArtCraftStudio \
            target/x86_64-apple-darwin/release/ArtCraftStudio \
            -output target/universal/ArtCraftStudio
          chmod +x target/universal/ArtCraftStudio

      - name: Normalize script line endings
        run: |
          sed -i '' -e 's/\r$//' ./scripts/*.sh 2>/dev/null || sed -i -e 's/\r$//' ./scripts/*.sh 2>/dev/null || true
          chmod +x ./scripts/*.sh

      - name: Fetch macOS Apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/fetch-apps.sh || true

      - name: Package macOS .app and .dmg
        run: |
          PREBUILT_BINARY="launcher/target/universal/ArtCraftStudio" ./scripts/build-macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraftStudio-macOS-Universal
          path: |
            dist/ArtCraftStudio.app
            release/ArtCraftStudio-macos.dmg
            release/ArtCraftStudio-macos-universal.zip
            release/ArtCraftStudio-macos-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ArtCraftStudio-Windows-x64/*
            artifacts/ArtCraftStudio-macOS-Universal/*
          draft: false
          prerelease: false
          generate_release_notes: true
